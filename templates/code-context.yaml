requirements: >-
  Node.js 20+. No account, no API key, no database server and no telemetry: embedding runs locally through a transformers.js model downloaded once on first use, and code never leaves the machine. CI-tested on Linux x64 (glibc) and macOS arm64; linux-arm64, musl and Windows-via-WSL are expected to work but are not CI-covered.
