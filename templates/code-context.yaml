decisionRule: >-
  Install with /plugin marketplace add infino-ai/code-context then /plugin install code-context@infino-ai, or add it as an MCP server with npx -y @infino-ai/code-context mcp - use one or the other, not both. The distinctive capability here is the sql tool: ranked search composed with GROUP BY answers repo-wide counting and ranking questions that grep cannot express at any budget, which is where its measured savings concentrate. On pinpoint symbol lookup it matches plain file tools rather than beating them. The tool names are bare, so do not load it beside another server that exposes a search tool.
extraClaims:
  - kind: benchmark
    label: token and tool-call reduction vs stock file tools
    statement: >-
      Reports -32% tokens, -53% tool calls and -32% wall time blended (-43% tokens on aggregation questions, -29% on comprehension) against stock file tools on a codebase-QA suite. Harness and question sets are committed in bench/ and re-runnable, but the test repository is the project's own engine and the questions are self-authored, so it is self-run and self-selected rather than independently replicated.
