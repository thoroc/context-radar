tool: code-context
githubUrl: https://github.com/infino-ai/code-context
layer: Code navigation
whatItDoes: >-
  Local retrieval layer for a coding agent, shipped as a CLI, an MCP server and a Claude Code plugin. One index over the repo answers three tools: search (a single ranked pass fusing BM25 keyword matching with semantic similarity by reciprocal-rank fusion, returning chunk content with path:line citations), sql (read-only SQL over the index, with the ranked search functions usable as table-valued relations, so "which files have the most code about X" is one GROUP BY), and reindex. The index lives in plain files inside the repo; the keyword half commits before the embedding model finishes downloading and vectors backfill in the background, so a failed model download degrades to keyword-only rather than blocking. Built on infino, which stores text and numeric data as Parquet. v0.5.0, 8 releases, Apache-2.0.
conflict:
  severity: soft
  projects:
    - codegraph
    - codebase-memory-mcp
    - Serena
    - tokensave
  note: >-
    Overlaps the code navigation cluster - all of these answer "where is the code about X" and the agent has to choose between them every turn. Its MCP tool names are unusually generic (search, sql, reindex) rather than namespaced, so loading it beside any other search-exposing server invites the agent to pick the wrong one. It retrieves by text relevance rather than by call graph, so it complements a graph tool more than it replaces one.
