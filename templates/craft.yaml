decisionRule: >-
  Install with claude plugin marketplace add drobins25/craft then claude plugin install craft@craft. Its context contribution is indirect: the gate keeps exploratory edits out of the repo, and the .craft/ record replaces an ever-growing CLAUDE.md with a queried project history. The surface is large for a 60-star plugin (26 agents, 30+ commands), so adopt it for the Write Gate and the workflow, not as a lightweight context tool. Do not run it alongside another write-blocking PreToolUse hook.
