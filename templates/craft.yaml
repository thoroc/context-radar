tool: craft
githubUrl: https://github.com/drobins25/craft
layer: Agent safety enforcement
whatItDoes: >-
  Claude Code plugin that makes the codebase read-only by default and routes every write through a Write Gate. A PreToolUse hook (check-write-permission.py) blocks edits unless the file is inside .craft/ or .claude/, the project is in dev_mode, CRAFT_WRITE_ENABLED is set, or an active workflow session exists, so changes only land as planned and approved work. Around that gate it keeps a local project record: cycles, stories, fixes, design tokens and decisions in .craft/, replayed into later sessions by a SessionStart context-injection hook instead of a growing CLAUDE.md. 26 agents and 30+ slash commands cover planning, mockups, review and a project dashboard. v2.6.0, 3 releases, MIT.
conflict:
  severity: soft
  projects:
    - faramesh-core
    - Sponsio
  note: >-
    Overlaps the agent safety enforcement layer (faramesh-core, Sponsio) - all three gate what the agent may do at hook time; running two write-blocking PreToolUse hooks means two independent refusals to reason about. Also overlaps the static context injection layer, since craft injects its own project record at session start.
