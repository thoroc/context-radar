verdict:
  decision: watch
  rationale: >-
    a genuinely different answer to long-horizon context (transient agents over a persistent Git world) but it replaces the coding agent rather than reducing an existing one's context
  evidence:
    status: confirmed
    sources:
      - url: https://github.com/EMI-Group/genesis/blob/3b84f87a5455340dd7f09d405a42f19dc992600c/apps/evo_git/lib/evo_git/agent/context_compression.ex#L5-L8
        quote: |-
          When the conversation context exceeds the token threshold, this module
            compresses the interaction history into a dense summary using an LLM call.
            This prevents context window overflow while preserving essential progress
            information.
        checkedOn: 2026-09-08
        evidenceType: source-code
decisionRule: >-
  Not something you add to a Claude Code stack today - it is a separate application, with its own UI, that runs the whole development loop. Watch it for the architectural idea rather than the install: bounding context per agent episode and carrying forward only accepted Git state is the opposite trade to the compression and retrieval tools elsewhere in this comparison. Check the AGPL-3.0 licence and the CLA before any commercial evaluation. Reported run results are observed system-level outcomes on the project's own demo repositories, not a normalised benchmark.
extraClaims:
  - kind: benchmark
    label: C compiler from an implementation-empty repository
    statement: >-
      Reports building a 248,989-line Rust-based C compiler from a repository with no compiler implementation, in a 123.4-hour run costing US$44.38, validated at 220/220 c-testsuite and 32/36 LLVM. Self-run on the project's own demo repository with no independent replication, and the project itself states these are observed system-level results rather than normalised benchmarks.
    proofLedger: SUPPORTED
    evidence:
      status: caveated
      sources:
