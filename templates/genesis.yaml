tool: EvoX Genesis
githubUrl: https://github.com/EMI-Group/genesis
layer: Agent runtime & context orchestration
whatItDoes: >-
  Standalone desktop agent runtime for long-horizon software development, built in Elixir on Phoenix. Instead of keeping one long session alive, it keeps a persistent software world (an accepted Git version plus a path) and spawns short-lived agents into it: each takes one task, works with only the context that task needs, and disappears, with only validated results advancing the version lineage. Recursive manager and executor hierarchies decompose and judge work. Context handling is explicit in the agent loop - a compression module summarises interaction history once a token threshold is crossed, appending the compression instruction as a new message so the provider's cached prefix stays reusable. State lives entirely in the Git repository, with no side database. v0.12.5, 54 releases, AGPL-3.0, paper at arXiv:2608.10450.
conflict:
  severity: none
  projects: []
  note: >-
    Nothing to collide with in a Claude Code stack, because it does not join one. It is a separate desktop application that replaces the coding agent rather than plugging into it, the same shape as ark in this layer. No MCP server and no Claude Code hooks.
runtime:
  languages: [elixir]
  detail: Elixir ~> 1.18 on Erlang/OTP 29, Phoenix LiveView, Tauri desktop shell
requirements: >-
  Desktop install (.dmg / .msi / .rpm / .AppImage) or a from-source build needing Elixir and Erlang/OTP. Drives foundation models through your own provider keys, so it is an LLM-dependent runtime, not a local utility. Contributors must sign a CLA. AGPL-3.0 needs a licence review before commercial internal use.
