tool: agent-memory-atlas
githubUrl: https://github.com/neoneye/agent-memory-atlas
layer: Reference resource (curated list)
whatItDoes: >-
  Code-grounded field guide to agent memory systems, published as a static site. 391 per-system reports, each written from a source checkout read at a pinned Git commit, plus 21 design patterns extracted across them and a cross-system comparison covering memory units, storage models, write paths, retrieval mechanics, correction semantics, trust models and operational risks. Ships its own agent skills - use-the-atlas (design memory for another product from the reports), add-memory-system (research and integrate another system), and screen-repository (a security screen to run on a checkout before reading or running it), with the screening ledger recording what has actually been screened and against which pin. Not installable software: it is research material for choosing a memory design. 0 releases, MIT.
conflict:
  severity: none
  projects: []
  note: >-
    Reference material, not installable, so nothing to collide with. Covers the same ground as Awesome-AI-Memory and awesome-second-brain but at a different depth: those are link lists, this reads each system's source at a pinned commit and writes a report. Useful when choosing between the tools in the Agent memory persistence layer.
