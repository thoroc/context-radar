decisionRule: >-
  Read it before committing to a memory tool, not instead of one. Its value over the other curated lists here is that each report is written against source at a pinned commit, so a claim can be checked rather than taken from a README. The repo's own guidance is to read five entry documents rather than browsing the reports, since reading widely leads to picking the most interesting mechanism over the smallest sufficient one. Treat report freshness by the pinned commit date, not the site's publication date.
