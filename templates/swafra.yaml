decisionRule: >-
  claude mcp add swafra -- swafra serve gets you the server; swafra setup is the part to think about, because it writes rules into your global ~/.claude/CLAUDE.md and installs a Stop hook that re-invokes Claude when it skips memory. That guarantees retrieval but adds tokens and turns to every session, which cuts against the rest of this comparison - install the server first and decide on the enforcement separately. swafra remove disables the hooks and keeps the data; swafra remove global deletes the data too. Revisit if development resumes.
extraClaims:
  - kind: benchmark
    label: LongMemEval-S retrieval recall
    statement: >-
      Reports 94.7% recall_all@10 on LongMemEval-S, a public fixed dataset, with the eval script committed in bench/ and reproducible offline. Self-run and not independently replicated. The project's own benchmark page is explicit that this is retrieval recall, a different and easier metric than the end-to-end QA accuracy that supermemory and mem0 report, so the side-by-side table of those numbers is not a like-for-like comparison.
    proofLedger: SUPPORTED
