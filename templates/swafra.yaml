tool: swafra
githubUrl: https://github.com/kunal12203/swafra
layer: Agent memory persistence
whatItDoes: >-
  Semantic memory MCP server with a knowledge-graph store, installable from PyPI or npm. Ingested text is chunked, embedded and graph-linked; retrieval fuses BM25 with n-gram matching and a source-diverse graph walk, exposed as add_knowledge, search_knowledge, get_context and graph_walk. Entity extraction is regex by default and upgrades to LLM extraction (with semantic dedup at ingest) if a provider key is configured; search never calls the LLM. Python and JS/TS SDKs and a CLI dashboard over the graph. swafra setup installs Claude Code enforcement so memory is actually consulted: tool descriptions marked mandatory, rules written into the user's global CLAUDE.md, and a Stop hook that wakes Claude back up if it skipped memory. v0.2.7, 2 releases, MIT.
conflict:
  severity: soft
  projects:
    - mem0
    - cognee
    - claude-mem
    - TrueMemory
    - supermemory
  note: >-
    Fact-memory tool, so it overlaps the rest of this layer - pick one. Its enforcement layer is the sharper conflict: swafra setup writes rules into the global ~/.claude/CLAUDE.md and registers a Stop hook, so running it beside another memory tool that does the same means two sets of always-on retrieval instructions competing in every session.
runtime:
  languages: [python, typescript]
  detail: Python engine with a TypeScript SDK and CLI wrapper over a Python subprocess
requirements: >-
  pip install swafra or npm install -g swafra. Works with no API key on regex extraction. An Anthropic, OpenAI or OpenAI-compatible key is optional and only improves ingest-time extraction. The repo ships prebuilt dist/ JavaScript alongside source.
