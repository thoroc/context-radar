tool: MemoryOps AI
githubUrl: https://github.com/patibandlavenkatamanideep/memoryops-ai
layer: Agent memory persistence
whatItDoes: >-
  Governed memory service for AI assistants, run as a FastAPI application with a Python SDK. Where most memory tools go message to vector store to retrieval, this puts a policy stage in front of every write and an admission stage in front of every read: an extractor proposes memories, a policy broker filters unsafe or secret-like content before storage, a context composer decides what actually enters the prompt, and a memory usage trace records which memories influenced an answer. Deletion produces tombstone lineage so a deleted memory is provably not retrievable again, and every lifecycle mutation commits with its audit event in one transaction as an append-only chain. Typed memory (episodic, semantic, procedural, project, knowledge, system), tenant isolation, JWT/JWKS auth adapters, and pluggable vector backends (Postgres/pgvector, in-memory, Qdrant, LanceDB, Weaviate). Platform release v2.5, 30 releases, MIT.
conflict:
  severity: none
  projects: []
  note: >-
    No MCP server and no Claude Code integration, so nothing in a Claude Code stack to collide with. Its SDK integrations target agent frameworks (LangGraph, CrewAI, AutoGen, OpenAI Agents, LlamaIndex, Semantic Kernel) rather than coding agents. Conceptually adjacent to mem0 and cognee, but aimed at governance and auditability for a production assistant rather than at cutting a coding session's context.
runtime:
  languages: [python, typescript]
  detail: Python FastAPI service and SDK, with a Next.js web frontend
requirements: >-
  Runs as a service, not a local utility: a uvicorn API process, plus Postgres and pgvector for anything beyond the in-memory store, with Docker Compose for the full stack. LLM adapters need your own provider keys. Two version tracks - the platform release (v2.5) is separate from the API and SDK contract (1.x).
