        checkedOn: 2026-09-08
        evidenceType: official-docs
decisionRule: >-
  Not installable into a Claude Code stack today - there is no MCP server, so reaching it from a coding agent means writing your own client against the SDK. Where it earns attention is the audit story: deletion proof, a per-answer memory usage trace, tenant isolation and an append-only audit chain are the properties a regulated deployment has to evidence, and they are enforced in tests rather than described in a README. Worth watching if you need a memory layer you can show a reviewer; not the tool for trimming a coding session's context. The published scorecard measures the project against its own suites, so treat the 100% as a regression gate rather than a comparative result.
extraClaims:
  - kind: benchmark
    label: memory-governance scorecard
    statement: >-
      Reports 50/50 (100%) across five governance suites with the two critical suites (deletion and leakage, tenant isolation) required to be perfect. The runner and cases are committed and run offline with no keys, and the same suites run against real Postgres and pgvector in CI, but the suites are authored by the project and score its own invariants, so this is a self-defined gate rather than a comparative benchmark.
    proofLedger: SUPPORTED
    evidence:
